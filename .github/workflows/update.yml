
name: Update market data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * 1-5'

permissions:
  contents: write

concurrency:
  group: market-data-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate updater regression tests
        run: bash scripts/validate_publication.sh

      - name: Save coverage baseline
        run: cp data/market.json /tmp/market-baseline.json

      - name: Update data
        env:
          FETCH_FINANCIALS: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python scripts/update_data.py

      - name: Update Korean market series and preserve valid snapshots
        run: python scripts/update_korean_market.py

      - name: Backfill Japanese financials
        run: python scripts/patch_japan_financials.py

      - name: Backfill Japan and Europe earnings
        run: python scripts/patch_regional_earnings.py

      - name: Apply verified source snapshots
        run: python scripts/apply_financial_backfills.py

      - name: Audit every company and reject coverage regressions
        run: python scripts/audit_coverage.py --baseline /tmp/market-baseline.json

      # Validate the actual refreshed candidate, not only the checkout baseline.
      # Any failure stops the job before git add, commit, or push.
      - name: Validate refreshed publication candidate
        run: bash scripts/validate_publication.sh

      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update market data"
            git push
          fi
